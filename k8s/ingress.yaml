apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odoo-staging-ingress
  namespace: odoo-staging
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
  - host: e08g04t07-staging-kubernetes.eastasia.cloudapp.azure.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: odoo-staging
            port:
              number: 8069
      - path: /longpolling
        pathType: Prefix
        backend:
          service:
            name: odoo-staging
            port:
              number: 8072
  tls:
  - hosts:
    - e08g04t07-staging-kubernetes.eastasia.cloudapp.azure.com
    secretName: odoo-staging-tls
