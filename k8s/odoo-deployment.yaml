apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-prod
  namespace: odoo-prod
  labels:
    app: odoo-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo-prod
  template:
    metadata:
      labels:
        app: odoo-prod
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        securityContext:
          runAsUser: 0
        command: ["sh", "-c", "chown -R 101:101 /var/lib/odoo && chmod 755 /var/lib/odoo"]
        volumeMounts:
        - name: odoo-prod-data
          mountPath: /var/lib/odoo
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z postgres 5432; do
            echo "Waiting for postgres..."; sleep 3;
          done
      containers:
      - name: odoo-prod
        image: theejr/odoo17:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8069
          name: http
        - containerPort: 8072
          name: longpoll
        env:
        - name: HOST
          value: "postgres"
        - name: PORT
          value: "5432"
        - name: USER
          value: "odoo"
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: odoo-prod-secrets
              key: DB_PASSWORD
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: odoo-prod-secrets
              key: ODOO_ADMIN_PASSWORD
        volumeMounts:
        - name: odoo-prod-data
          mountPath: /var/lib/odoo
        - name: odoo-prod-config
          mountPath: /etc/odoo/odoo.conf
          subPath: odoo.conf
        readinessProbe:
          httpGet:
            path: /web/database/selector
            port: 8069
          initialDelaySeconds: 45
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /web/database/selector
            port: 8069
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
      volumes:
      - name: odoo-prod-data
        persistentVolumeClaim:
          claimName: odoo-prod-data-pvc
      - name: odoo-prod-config
        configMap:
          name: odoo-prod-config
