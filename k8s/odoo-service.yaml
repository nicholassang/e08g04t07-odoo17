apiVersion: v1
kind: Service
metadata:
  name: odoo-staging
  namespace: odoo-staging
  labels:
    app: odoo-staging
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: esmos-odoo-staging
spec:
  type: LoadBalancer
  selector:
    app: odoo-staging
  ports:
  - name: http
    protocol: TCP
    port: 8069
    targetPort: 8069
  - name: longpoll
    protocol: TCP
    port: 8072
    targetPort: 8072
