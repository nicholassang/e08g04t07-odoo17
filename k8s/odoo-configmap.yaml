apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  labels:
    app: odoo
data:
  odoo.conf: |
    [options]
    addons_path = /mnt/extra-addons,/mnt/odoo-addons
    data_dir = /var/lib/odoo
    db_host = postgres
    db_port = 5432
    db_user = odoo
    db_password = odoo
    proxy_mode = True
    limit_time_cpu = 600
    limit_time_real = 1200
    db_maxconn = 64
    workers = 2
    max_cron_threads = 1
    admin_passwd = 214Odoo
