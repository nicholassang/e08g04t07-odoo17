apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-prod-config
  namespace: odoo-prod
  labels:
    app: odoo-prod
data:
  odoo.conf: |
    [options]
    addons_path = /mnt/odoo-addons,/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
    data_dir = /var/lib/odoo
    db_host = postgres
    db_port = 5432
    db_user = odoo
    proxy_mode = False
    limit_time_cpu = 600
    limit_time_real = 1200
    db_maxconn = 64
    workers = 2
    max_cron_threads = 1
    logfile = /dev/stdout
    log_level = info
