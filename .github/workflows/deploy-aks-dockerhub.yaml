name: CI/CD Docker Hub → AKS

on:
  push:
    branches:
      - aks-acr-azuredevops  # branch that triggers deployment

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build and push custom Odoo image
      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/odoo:17-custom
          docker build -t $IMAGE .
          docker push $IMAGE

      # 4️⃣ Set up kubeconfig for AKS
      - name: Test AKS API DNS
        run: |
          nslookup odookubern-odookubernetescl-677a5f-rxx2bx6t.hcp.eastasia.azmk8s.io
          curl -k https://odookubern-odookubernetescl-677a5f-rxx2bx6t.hcp.eastasia.azmk8s.io:443

      - name: Create kubeconfig directory
        run: mkdir -p $HOME/.kube

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config
          kubectl config view
          kubectl get nodes

      # Note: more reliable than kubeconfig, but we need a service principal with cluster admin permissions
      #- name: Azure Login
      #  uses: azure/login@v1
      #  with:
      #    creds: ${{ secrets.AZURE_CREDENTIALS }}

      #- name: Get AKS credentials
      #  run: |
      #    az aks get-credentials --resource-group OdooKubernetesCluster_group \
      #                           --name OdooKubernetesCluster \
      #                           --overwrite-existing
      #    kubectl get nodes

      # 5️⃣ Update deployment manifest with new Docker image
      - name: Update Odoo deployment image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/odoo:17-custom
          sed -i "s|image: .*|image: $IMAGE|g" k8s/odoo-deployment.yaml

      # 6️⃣ Apply Kubernetes manifests
      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/odoo
          kubectl rollout status deployment/postgres